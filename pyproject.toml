[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coconat"
version = "0.2.0"
description = "Reproducible cross-query NER inference and TKDD revision experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
hf = ["torch>=2.3,<3", "transformers==4.49.0", "datasets>=3.4,<5", "accelerate>=0.26,<2", "sentencepiece>=0.2", "protobuf>=4"]
analysis = ["scikit-learn>=1.4,<2", "scipy>=1.11,<2", "matplotlib>=3.8,<4"]
gliner = ["gliner>=0.2.16,<0.3"]
flair = ["flair>=0.14,<0.16"]
spacy = ["spacy>=3.7,<4"]
dev = ["ruff>=0.9,<1"]

[project.scripts]
coconat = "coconat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
